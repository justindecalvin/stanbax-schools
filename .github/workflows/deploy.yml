name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Vite static application
        run: bun run build
        env:
          # Optional GitHub Secrets: set ADMIN_PASSWORD / PROPRIETRESS_PASSWORD
          # in repo Settings → Secrets to override the built-in demo defaults.
          VITE_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          VITE_PROPRIETRESS_PASSWORD: ${{ secrets.PROPRIETRESS_PASSWORD }}
          # Supabase connection (safe publishable key — security is RLS-side)
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Create 404.html for GitHub Pages SPA routing
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
