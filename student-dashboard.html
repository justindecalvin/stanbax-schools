<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard - Stanbax</title>
  <link rel="stylesheet" href="dashboard.css" />
  <script type="module" src="student-dashboard.js" defer></script>
</head>
<body>
  <div class="dashboard">
    <h2>Welcome, <span id="student-name">Student</span></h2>
    <div class="card-section">
<div class="card">
  <h3>Upload Payment Proof</h3>
  <input type="file" id="payment-file" />
  <button id="upload-payment-btn">Upload Payment</button>
  <p id="payment-msg"></p>
</div>
        <h3>My Profile</h3>
        <p>Email: <span id="student-email"></span></p>
        <p>Role: Student</p>
      </div>

      <div class="card">
        <h3>Check Results</h3>
        <button id="view-results-btn">View Results</button>
        <div id="results-display"></div>
      </div>
<div class="card">
  <h3>Chat with a Teacher</h3>
  <input type="email" id="chat-recipient" placeholder="Recipient's Email" />
  <div id="chat-box" style="height: 200px; overflow-y: scroll; border: 1px solid #ccc; padding: 5px;"></div>
  <input type="text" id="chat-message" placeholder="Type a message" />
  <button id="send-chat">Send</button>
</div>
      <div class="card">
        <h3>Upload Assignment</h3>
        <input type="file" id="assignment-file" />
        <button id="upload-assignment-btn">Upload</button>
        <p id="assignment-msg"></p>
      </div>
<button id="logout-btn">Logout</button>
      <div class="card">
        <h3>Progress Report</h3>
        <div id="progress-content">Loading...</div>
      </div>
    </div>
  </div>
</body>
</html>
